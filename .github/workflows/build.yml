name: Build FireDog Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install
        working-directory: .

      - name: Build FireDog
        run: npm run build
        working-directory: .

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: FireDog-Windows
          path: dist/*
